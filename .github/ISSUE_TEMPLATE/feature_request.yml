name: 功能建议
description: 建议符合项目边界的新能力或改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        项目处于 Alpha 阶段，当前支持 POSIX 平台并保持零第三方运行时依赖。请勿提交真实评论、CSV、state、Cookie、账号信息或内部文档。

  - type: textarea
    id: problem
    attributes:
      label: 问题与使用场景
      description: 说明用户问题，不使用真实数据作为示例。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明 CLI、JSON、CSV 或 checkpoint 的预期变化。
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性与安全影响
      description: 说明对 Alpha、POSIX、零运行依赖、认证和恢复边界的影响。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 说明是否可由独立下游工具完成。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已阅读 ROADMAP，并确认建议未被重复记录。
          required: true
        - label: 建议不要求绕过登录、验证码、限流、平台规则或访问控制。
          required: true
        - label: 示例中不含 Cookie、真实数据、账号信息或本机路径。
          required: true
